name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.9", "3.13" ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest

      - name: Run examples
        run: |
          for f in examples/*.py; do
            echo "== $f"
            python "$f" > /dev/null
          done

      # Repo rule: comments/docstrings stay ASCII-clean English.
      - name: Language guard (no German umlauts in src/ tests/ tools/)
        run: |
          if grep -rn '[äöüÄÖÜß]' src tests tools; then
            echo "::error::German umlauts found in src/, tests/ or tools/"
            exit 1
          fi
