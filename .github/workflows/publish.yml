name: Publish

# Two triggers, two targets:
#  * manual run  -> dry run: tests + build + twine check, no upload
#  * release     -> build and publish to PyPI
#
# PyPI auth: API token stored as repo secret PYPI_API_TOKEN (owner-provided,
# entered via masked input). TestPyPI is deliberately not used: a pypi.org
# token cannot be rehearsed there and it would need a second trusted-
# publisher setup.

on:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Zeppelin500/MBusinoLibPy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Check version matches release tag
        if: github.event_name == 'release'
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::pyproject version ($VERSION) does not match release tag ($TAG)"
            exit 1
          fi

      - name: Build wheel and sdist
        run: python -m build

      - name: Check metadata (twine check)
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    if: github.event_name == 'release' && github.repository == 'Zeppelin500/MBusinoLibPy'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/MBusinoLibPy/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: "*** PYPI_API_TOKEN }}"
