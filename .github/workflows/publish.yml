name: Publish

# Two triggers, two targets:
#  * manual run  -> dry run: tests + build + twine check, no upload
#                   (first release: run with input publish=true, see note below)
#  * release     -> build and publish to PyPI
#
# Authentication: PyPI Trusted Publishing (OIDC) - no API tokens, no secrets.
# One-time owner setup on pypi.org (Account -> Publishing -> Add a new pending
# publisher) with these exact values:
#   project name:  MBusinoLibPy
#   owner:         Zeppelin500
#   repository:    MBusinoLibPy
#   workflow name: publish.yml
#   environment:   pypi
#
# Note: a release run is pinned to the commit it was created from, so the
# existing release v0.10.0 still contains the old token-based workflow. That
# FIRST release is published via workflow_dispatch with input publish=true;
# all later releases publish automatically through the release trigger.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built distributions to PyPI (Trusted Publishing)"
        type: boolean
        default: false
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Zeppelin500/MBusinoLibPy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Check version matches release tag
        if: github.event_name == 'release'
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::pyproject version ($VERSION) does not match release tag ($TAG)"
            exit 1
          fi

      - name: Build wheel and sdist
        run: python -m build

      - name: Check metadata (twine check)
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    if: github.repository == 'Zeppelin500/MBusinoLibPy' && (github.event_name == 'release' || inputs.publish == true)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/MBusinoLibPy/
    permissions:
      id-token: "***"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Trusted Publishing: no password/token input - the action authenticates
      # via OIDC against the pending publisher registered on pypi.org.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
